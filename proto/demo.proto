syntax = "proto3";

package hipstershop;

option go_package = "github.com/GoogleCloudPlatform/miscroservices-demo/hipstershop";

service CartService {
  rpc AddItem(AddItemRequest) returns (Empty) {}
  rpc GetCart(GetCartRequest) returns (Cart) {}
  rpc EmptyCart(EmptyCartRequest) returns (Empty) {}
}

service RecommendationService {
  rpc ListRecommendations(ListRecommendationsRequest) returns (ListRecommendationsResponse) {}
}

service ProductCatalogService {
  rpc ListProducts(Empty) returns (ListProductsResponse) {}
  rpc GetProduct(GetProductRequest) returns (Product) {}
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse) {}
  rpc ListProductsFiltered(ListProductsRequest) returns (ListProductsResponse) {}
  rpc ListCategories(Empty) returns (ListCategoriesResponse) {}
}

service ShippingService {
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse) {}
  rpc ShipOrder(ShipOrderRequest) returns (ShipOrderResponse) {}
}

service CurrencyService {
  rpc GetSupportedCurrencies(Empty) returns (GetSupportedCurrenciesResponse) {}
  rpc Convert(CurrencyConversionRequest) returns (Money) {}
}

service PaymentService {
  rpc Charge(ChargeRequest) returns (ChargeResponse) {}
}

service EmailService {
  rpc SendOrderConfirmation(SendOrderConfirmationRequest) returns (Empty) {}
}

service CheckoutService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse) {}
}

service AdService {
  rpc GetAds(AdRequest) returns (AdResponse) {}
  rpc RecordClick(RecordClickRequest) returns (RecordClickResponse);
  rpc GetAdStats(GetAdStatsRequest) returns (GetAdStatsResponse);
}

message CartItem {
  string product_id = 1;
  int32 quantity = 2;
}

message AddItemRequest {
  string user_id = 1;
  CartItem item = 2;
}

message EmptyCartRequest {
  string user_id = 1;
}

message GetCartRequest {
  string user_id = 1;
}

message Cart {
  string user_id = 1;
  repeated CartItem items = 2;
}

message Empty {}

message ListRecommendationsRequest {
  string user_id = 1;
  repeated string product_ids = 2;
}

message ListRecommendationsResponse {
  repeated string product_ids = 1;
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string picture = 4;
  Money price_usd = 5;
  // Categories such as "clothing" or "kitchen" that can be used to look up
  // other related products.
  repeated string categories = 6;
  // Fields 7-15 were added for the general store (additive; older clients ignore them).
  // Same numbers as product-catalog-service proto/productcatalog.proto.
  string brand = 7;
  double rating = 8;          // average rating 0-5
  int32 review_count = 9;     // 0 here; reviews live in review-service
  int32 stock = 10;
  int32 weight_grams = 11;
  repeated string tags = 12;
  repeated string images = 13;  // relative paths served by frontend, e.g. /static/img/products/<id>-1.webp
  string thumbnail = 14;        // relative path of the small image
  string department = 15;       // Category.id of the product's department, "" if none
}

message ListProductsResponse {
  repeated Product products = 1;
  // Set only by ListProductsFiltered (ListProducts returns everything and leaves them 0).
  int32 total = 2;      // number of matches over all pages
  int32 page = 3;       // effective page (1-based)
  int32 page_size = 4;  // effective page size
}

message GetProductRequest {
  string id = 1;
}

message SearchProductsRequest {
  string query = 1;
}

message SearchProductsResponse {
  repeated Product results = 1;
}

message GetQuoteRequest {
  Address address = 1;
  repeated CartItem items = 2;
}

message GetQuoteResponse {
  Money cost_usd = 1;
}

message ShipOrderRequest {
  Address address = 1;
  repeated CartItem items = 2;
}

message ShipOrderResponse {
  string tracking_id = 1;
}

message Address {
  string street_address = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  int32 zip_code = 5;
}

// Represents an amount of money with its currency type.
message Money {
  // The 3-letter currency code defined in ISO 4217.
  string currency_code = 1;

  // The whole units of the amount.
  // For example if `currencyCode` is `"USD"`, then 1 unit is one US dollar.
  int64 units = 2;

  // Number of nano (10^-9) units of the amount.
  // The value must be between -999,999,999 and +999,999,999 inclusive.
  // If `units` is positive, `nanos` must be positive or zero.
  // If `units` is zero, `nanos` can be positive, zero, or negative.
  // If `units` is negative, `nanos` must be negative or zero.
  // For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
  int32 nanos = 3;
}

message GetSupportedCurrenciesResponse {
  // The 3-letter currency code defined in ISO 4217.
  repeated string currency_codes = 1;
}

message CurrencyConversionRequest {
  Money from = 1;
  // The 3-letter currency code defined in ISO 4217.
  string to_code = 2;
}

message CreditCardInfo {
  string credit_card_number = 1;
  int32 credit_card_cvv = 2;
  int32 credit_card_expiration_year = 3;
  int32 credit_card_expiration_month = 4;
}

message ChargeRequest {
  Money amount = 1;
  CreditCardInfo credit_card = 2;
}

message ChargeResponse {
  string transaction_id = 1;
}

message OrderItem {
  CartItem item = 1;
  Money cost = 2;
}

message OrderResult {
  string order_id = 1;
  string shipping_tracking_id = 2;
  Money shipping_cost = 3;
  Address shipping_address = 4;
  repeated OrderItem items = 5;
}

message SendOrderConfirmationRequest {
  string email = 1;
  OrderResult order = 2;
}

message PlaceOrderRequest {
  string user_id = 1;
  string user_currency = 2;
  Address address = 3;
  string email = 5;
  CreditCardInfo credit_card = 6;
  string account_id = 7; // optional: the signed-in user; checkout stores it as the order's user_id (user_id above stays the cart key)
  string idempotency_key = 8; // optional, 0-64 characters of [A-Za-z0-9._-]; the same key replays the same order instead of placing a second one
}

message PlaceOrderResponse {
  OrderResult order = 1;
}

message AdRequest {
  // List of important key words from the current page describing the context.
  repeated string context_keys = 1;
}

message AdResponse {
  repeated Ad ads = 1;
}

message Ad {
  // url to redirect to when an ad is clicked.
  string redirect_url = 1;

  // short advertisement text to display.
  string text = 2;

  // stable id of the ad (slice 7), used for click tracking.
  string id = 3;
}

message RecordClickRequest { string ad_id = 1; }
message RecordClickResponse {}
message GetAdStatsRequest {}
message AdStat { string ad_id = 1; int64 impressions = 2; int64 clicks = 3; }
message GetAdStatsResponse { repeated AdStat stats = 1; }

// ----- product catalog: browse (added for the general store, copied from product-catalog-service) -----

enum ProductSort {
  PRODUCT_SORT_UNSPECIFIED = 0;  // same as PRODUCT_SORT_NAME_ASC
  PRODUCT_SORT_NAME_ASC = 1;
  PRODUCT_SORT_PRICE_ASC = 2;
  PRODUCT_SORT_PRICE_DESC = 3;
  PRODUCT_SORT_RATING_DESC = 4;
}

message ListProductsRequest {
  string department = 1;   // Category.id; "" = all departments
  string query = 2;        // case-insensitive substring over name, description, brand, tags; "" = no filter
  ProductSort sort = 3;
  int32 page = 4;          // 1-based; 0 = 1
  int32 page_size = 5;     // 0 = 24, values above 100 are capped at 100
}

message Category {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 product_count = 4;
}

message ListCategoriesResponse {
  repeated Category categories = 1;  // in display order
}
