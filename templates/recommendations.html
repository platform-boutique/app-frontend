{{ define "recommendations" }}
<section class="recommendations container" aria-labelledby="reco-title">
    <div class="section-head">
        <h2 id="reco-title">You may also like</h2>
    </div>
    <ul class="reco-grid">
        {{ range .recommendations }}
        <li class="product-card">
            <div class="media">
                <img loading="lazy" src="{{ $.baseUrl }}{{ or .Thumbnail .Picture }}" alt="{{ .Name }}" width="600" height="600">
            </div>
            <div class="product-card-meta">
                <a class="product-card-link" href="{{ $.baseUrl }}/product/{{ .Id }}">{{ .Name }}</a>
            </div>
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
